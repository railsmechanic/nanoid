name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.15"
            otp: "25"
          - elixir: "1.16"
            otp: "26"
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18"
            otp: "27"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang / Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      # The top-level Nanoid module intentionally delegates to deprecated
      # submodule functions so the deprecation also surfaces at `mix compile`
      # time for any caller. We therefore can't use `--warnings-as-errors`,
      # but we still fail the build on any *non-deprecation* warning.
      - name: Compile and check for unexpected warnings
        run: |
          set -o pipefail
          mix compile 2>&1 | tee compile.log
          unexpected=$(grep -E "^\s*warning:" compile.log | grep -v "is deprecated" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected compiler warnings:"
            echo "$unexpected"
            exit 1
          fi

      - name: Run tests
        run: mix test
